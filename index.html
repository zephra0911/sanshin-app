function levelIcon(level) {
  const lv = parseInt(level) || 0;
  if (lv === 1) return "🐥";
  if (lv === 2) return "🐔";
  if (lv === 3) return "👘";
  return null;
}

function chindamiIcon(chindami) {
  if (chindami === "二上げ") return <span style={{fontSize:11,padding:"2px 5px",borderRadius:4,background:"#f0f0f0",color:"#555",fontWeight:"bold",whiteSpace:"nowrap"}}>↑2</span>;
  if (chindami === "三下げ") return <span style={{fontSize:11,padding:"2px 5px",borderRadius:4,background:"#f0f0f0",color:"#555",fontWeight:"bold",whiteSpace:"nowrap"}}>↓3</span>;
  return null;
}

function taruGoogleUrl(title) {
  return `https://www.google.com/search?q=${encodeURIComponent(title)}+%E5%94%84+%E5%88%86%E6%9E%90`;
}

function getMastery(count) {
  if (count >= 10) return { stage: "🏆 暗譜完璧", color: "#d4af37", bg: "#fffbea" };
  if (count >= 7)  return { stage: "⭐ 仕上げ",   color: "#e67e22", bg: "#fef5ec" };
  if (count >= 5)  return { stage: "📈 定着中",   color: "#27ae60", bg: "#eafaf1" };
  if (count >= 3)  return { stage: "🎵 練習中",   color: "#2980b9", bg: "#eaf4fb" };
  return           { stage: "🌱 導入",            color: "#7f8c8d", bg: "#f4f6f7" };
}

function toHankaku(str) {
  return str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
}

function extractDate(line, year) {
  const l = toHankaku(line);
  const today = new Date().toISOString().slice(0,10);

  const adjustYear = (dateStr) => {
    // 未来日付なら昨年として扱う
    if (dateStr > today) {
      return `${parseInt(dateStr.slice(0,4)) - 1}${dateStr.slice(4)}`;
    }
    return dateStr;
  };

  // YYYY/MM/DD or YYYY-MM-DD: 年が明示されているのでそのまま使用
  let m = l.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  // YYYY年M月D日: 年が明示されているのでそのまま使用
  m = l.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})\s*日/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  // M月D日: 年なしなので未来日付チェックあり
  m = l.match(/(\d{1,2})月\s*(\d{1,2})\s*日/);
  if (m) return adjustYear(`${year}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`);
  // M/D: 年なしなので未来日付チェックあり
  m = l.match(/(\d{1,2})\/(\d{1,2})/);
  if (m) return adjustYear(`${year}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`);
  return null;
}

function normalizeNumber(raw) {
  return String(raw).replace(/[-－].+$/, "").padStart(3, "0");
}

function generateTemplate(session) {
  if (!session) return "";
  const today = new Date();
  const y = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  const kimono = session.songs.filter(s => s.group === "着物組");
  const hiyoko = session.songs.filter(s => s.group === "ひよこ組");
  return [
    `${y}/${mm}/${dd}のお稽古曲です`,
    "",
    "第一部",
    ...kimono.map(s => `${parseInt(s.number)} ${s.title}`),
    "",
    "第二部",
    ...hiyoko.map(s => `${parseInt(s.number)} ${s.title}`),
    "",
    "以上でした〜",
  ].join("\n");
}

function parseLineText(text, overrideDate) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const year = new Date().getFullYear();
  const blocks = [];
  let current = null;
  for (const line of lines) {
    const d = extractDate(line, year);
    if (d) {
      current = { date: d, dateFound: true, lines: [] };
      blocks.push(current);
    } else if (current) {
      current.lines.push(line);
    }
  }
  if (blocks.length === 0) {
    blocks.push({ date: new Date().toISOString().slice(0,10), dateFound: false, lines });
  }
  const results = blocks.map(block => {
    const songs = [];
    let group = "着物組";
    let order = 1;
    for (const line of block.lines) {
      if (/第?[2二]部|後半|ひよこ組/.test(line)) { group = "ひよこ組"; continue; }
      if (/第?[1一]部|前半|着物組/.test(line)) { group = "着物組"; continue; }
      const sm = line.match(/^(\d{1,3}[-－]?\d*)\s*(.+)/);
      if (sm) {
        const num = normalizeNumber(sm[1]);
        const titleRaw = sm[2].replace(/🆕/g,"").replace(/[\u{1F300}-\u{1FFFF}]/gu,"").trim();
        const titleFromDB = SONG_DB[num]?.title;
        // SONG_DBにない場合は自動追加
        if (!titleFromDB && titleRaw && titleRaw.length > 1) {
          SONG_DB[num] = { title: titleRaw };
          gasSaveSong(num, titleRaw);
        }
        songs.push({ order: order++, number: num, title: titleFromDB || titleRaw, group });
      }
    }
    return { date: overrideDate || block.date, dateFound: block.dateFound, songs };
  }).filter(r => r.songs.length > 0);
  if (results.length === 0) throw new Error("曲が見つかりませんでした");
  return results;
}

function lastSunday(year, month) {
  const last = new Date(year, month, 0);
  while (last.getDay() !== 0) last.setDate(last.getDate() - 1);
  const y = last.getFullYear();
  const m = String(last.getMonth()+1).padStart(2,"0");
  const d = String(last.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

let _authToken = null; // グローバルトークン保持
const IS_PRODUCTION = typeof location !== "undefined" &&
  location.hostname === "zephra0911.github.io";

const GAS_URL = "https://script.google.com/macros/s/AKfycbzE1OoXs3H47LbfW1X_Hu25wNNoqNrWzpl3di_WOx-2VQNmtObX-YF2XDDUSH2rm8h1/exec";

async function gasGet(action) {
  const res = await fetch(`${GAS_URL}?action=${action}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── 曲マスタのキャッシュ（localStorage・1週間有効） ───
const SONGS_CACHE_KEY = "sanshin_songs_cache";
const SONGS_CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 1週間

function getSongsFromCache() {
  try {
    const raw = localStorage.getItem(SONGS_CACHE_KEY);
    if (!raw) return null;
    const cached = JSON.parse(raw);
    if (Date.now() - cached.timestamp > SONGS_CACHE_TTL) return null;
    return cached.data;
  } catch(e) { return null; }
}

function saveSongsToCache(data) {
  try {
    localStorage.setItem(SONGS_CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
  } catch(e) { console.error("曲マスタキャッシュ保存エラー:", e); }
}

// ── 日誌のキャッシュ（表示の初期値のみ。常にバックグラウンドで最新化） ──
const DIARY_CACHE_KEY = "sanshin_diary_cache";

function getDiaryFromCache() {
  try {
    const raw = localStorage.getItem(DIARY_CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function saveDiaryToCache(data) {
  try {
    localStorage.setItem(DIARY_CACHE_KEY, JSON.stringify(data));
  } catch(e) { console.error("日誌キャッシュ保存エラー:", e); }
}

async function gasSaveSong(number, title) {
  if (!IS_PRODUCTION) return;
  const params = new URLSearchParams({
    action: "saveAll",
    newSong: encodeURIComponent(JSON.stringify({ number, title })),
  });
  fetch(`${GAS_URL}?${params}`).catch(e => console.error("曲追加エラー:", e));
}

// セッション追記
async function gasAppendSessions(sessions) {
  if (!IS_PRODUCTION) return;
  for (const session of sessions) {
    const params = new URLSearchParams({
      action: "appendSession",
      date: session.date,
      songs: encodeURIComponent(JSON.stringify(session.songs)),
      token: _authToken || "",
    });
    const res = await fetch(`${GAS_URL}?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }
}

// セッション削除
async function gasDeleteSession(date) {
  if (!IS_PRODUCTION) return;
  const params = new URLSearchParams({ action: "deleteSession", date, token: _authToken || "" });
  const res = await fetch(`${GAS_URL}?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

// セッション更新（削除→追記）
async function gasUpdateSession(session) {
  if (!IS_PRODUCTION) return;
  await gasDeleteSession(session.date);
  await gasAppendSessions([session]);
}

function gasCheckUser(name, retried) {
  if (!IS_PRODUCTION) return Promise.resolve({ exists: true });
  return gasGet("checkUser&name=" + encodeURIComponent(name))
    .catch(function(e){
      console.error("checkUser error:", e);
      // 初回失敗時は1回だけリトライ（GASのコールドスタート対策）
      if (!retried) return gasCheckUser(name, true);
      return { exists: false };
    });
}

function gasRegisterUser(name) {
  if (!IS_PRODUCTION) return Promise.resolve();
  return fetch(GAS_URL + "?action=registerUser&name=" + encodeURIComponent(name));
}

function gasLoginCountUp(name) {
  if (!IS_PRODUCTION) return Promise.resolve();
  return fetch(GAS_URL + "?action=loginCountUp&name=" + encodeURIComponent(name));
}

function gasSaveSongInfo(info) {
  if (!IS_PRODUCTION) return Promise.resolve({ success: true });
  var url = GAS_URL + "?action=saveSongInfo"
    + "&number=" + encodeURIComponent(info.number)
    + "&chindami=" + encodeURIComponent(info.chindami || "")
    + "&note=" + encodeURIComponent(info.note || "")
    + "&lyricist=" + encodeURIComponent(info.lyricist || "")
    + "&composer=" + encodeURIComponent(info.composer || "")
    + "&genre=" + encodeURIComponent(info.genre || "")
    + "&level=" + encodeURIComponent(info.level !== undefined ? info.level : "")
    + "&token=" + encodeURIComponent(_authToken || "");
  return fetch(url).then(function(r){ return r.json(); });
}

function gasSaveMyMarks(marksStr) {
  if (!IS_PRODUCTION) return Promise.resolve({ success: true });
  return fetch(GAS_URL + "?action=saveMyMarks&marks=" + encodeURIComponent(marksStr) + "&token=" + encodeURIComponent(_authToken || ""))
    .then(function(r){ return r.json(); });
}

function gasPost(action, data) {
  if (!IS_PRODUCTION) return Promise.resolve({ success: true, skipped: true });
  var key = action === "saveDiary" ? "diary"
    : action === "saveEvents" ? "events"
    : action === "saveImport" ? "importResult" : null;
  if (!key) return Promise.reject(new Error("unknown action"));
  var jsonStr = JSON.stringify(data);
  // チャンク分割送信（URLの長さ制限を回避）
  var CHUNK = 500;
  var chunks = [];
  for (var i = 0; i < jsonStr.length; i += CHUNK) chunks.push(jsonStr.slice(i, i+CHUNK));
  var promise = Promise.resolve();
  chunks.forEach(function(chunk, idx) {
    promise = promise.then(function() {
      var url = GAS_URL + "?action=saveChunk"
        + "&key=" + encodeURIComponent(key)
        + "&chunk=" + encodeURIComponent(chunk)
        + "&index=" + idx
        + "&total=" + chunks.length
        + "&token=" + encodeURIComponent(_authToken || "");
      return fetch(url).then(function(r){ return r.json(); });
    });
  });
  return promise.then(function() {
    var url = GAS_URL + "?action=commitChunk&key=" + encodeURIComponent(key) + "&token=" + encodeURIComponent(_authToken || "");
    return fetch(url).then(function(r){ return r.json(); });
  });
}

    } else {

  // ── 起動時自動読み込み ───────────────────────────────
  const [gasLoading, setGasLoading] = useState(true);
  const [gasLoadError, setGasLoadError] = useState(false);
  const gasLoadingRef = useRef(true);
  useEffect(() => { gasLoadingRef.current = gasLoading; }, [gasLoading]);

  useEffect(() => {
    (async () => {
      if (IS_PRODUCTION) {
        // GitHub Pages: スプレッドシートから読み込む
        try {
          const initData = await gasGet("getAllInitData");
          const diaryData = initData.diary;
          const eventsData = initData.events;
          const importData = initData.importResult;
          const songsData = initData.songs;
          const awardData = initData.awardHistory;
          if (awardData && Object.keys(awardData).length > 0) setAwardHistory(awardData);
          if (Array.isArray(initData.links) && initData.links.length > 0) setLinks(initData.links);
          // 曲マスタをSONG_DBに反映＆キャッシュ更新
          if (songsData && Object.keys(songsData).length > 0) {
            SONG_DB = songsData;
            setSongDB(songsData);
            saveSongsToCache(songsData);
          }
          // GitHub Pages: シートのデータのみ使用（ハードコードは使わない）
          if (Array.isArray(diaryData) && diaryData.length > 0) { setDiary(diaryData); saveDiaryToCache(diaryData); }
          if (Array.isArray(eventsData) && eventsData.length > 0) setEvents(eventsData);
          if (importData) setImportResult(importData);
        } catch(e) {
          console.error("GAS読み込みエラー:", e);
          setGasLoadError(true);
        }
      } else {
        // Artifact: ハードコードデータを使用
        setDiary(INITIAL_DIARY);
      }
      setGasLoading(false);
    })();
  }, []);

  // ── GAS連携 ──────────────────────────────────────────
  const handleLoadFromGAS = async () => {
    setGasSyncing(true);
    setGasStatus("");
    try {
      const initData = await gasGet("getAllInitData");
      const diaryData = initData.diary;
      const eventsData = initData.events;
      const importData = initData.importResult;
      const songsData2 = initData.songs;
      const awardData2 = initData.awardHistory;
      if (Array.isArray(diaryData) && diaryData.length > 0) { setDiary(diaryData); saveDiaryToCache(diaryData); }
      if (Array.isArray(eventsData) && eventsData.length > 0) { setEvents(eventsData); }
      if (importData) { setImportResult(importData); }
      if (songsData2 && Object.keys(songsData2).length > 0) { SONG_DB = songsData2; setSongDB(songsData2); saveSongsToCache(songsData2); }
      if (awardData2 && Object.keys(awardData2).length > 0) { setAwardHistory(awardData2); }
      setGasStatus(`✅ 読み込み完了（日誌${Array.isArray(diaryData)?diaryData.length:0}回）`);
    } catch(e) {
      setGasStatus(`❌ 読み込み失敗: ${e.message}`);
    }
    setGasSyncing(false);
  };

  const handleSaveToGAS = async () => {
    setGasSyncing(true);
    setGasStatus("");
    try {
      const result = await gasPost("saveDiary", diary);
      if (result.success) {
        setGasStatus(`✅ ${diary.length}回分を保存しました`);
      } else {
        setGasStatus(`❌ 保存失敗: ${result.error}`);
      }
    } catch(e) {
      setGasStatus(`❌ 保存失敗: ${e.message}`);
    }
    setGasSyncing(false);
  };

  // ── 日誌解析 ──────────────────────────────────────────
  const handleAnalyze = () => {
    if (!lineText.trim()) return;
    setParseError(""); setParseResults([]);
    try {
      const results = parseLineText(lineText);
      if (results.some(r => !r.dateFound)) {
        setDateModalDate(new Date().toISOString().slice(0,10));
        setShowDateModal(true);
        setPendingResults(results);
        return;
      }
      setParseResults(results);
    } catch(e) { setParseError(e.message); }
  };

  const handleDateConfirm = (date) => {
    setParseResults(pendingResults.map(r => !r.dateFound ? {...r, date} : r));
    setPendingResults([]); setShowDateModal(false);
  };

  const handleSaveDiary = () => {
    if (!parseResults.length) return;
    let next = [...diary];
    for (const r of parseResults) {
      const idx = next.findIndex(d => d.date === r.date);
      if (idx >= 0) next[idx] = r; else next.push(r);
    }
    next = next.sort((a,b) => b.date.localeCompare(a.date));
    setDiary(next);
    saveDiaryToCache(next);
    setParseResults([]); setLineText(""); setTab("history");
    // 新規セッションのみ追記
    gasAppendSessions(parseResults).catch(e => console.error("GAS追記エラー:", e));
  };

  // ── 履歴編集・削除 ────────────────────────────────────
  const handleDeleteDiary = (date) => {
    const next = diary.filter(d => d.date !== date);
    setDiary(next);
    saveDiaryToCache(next);
    setSelectedEntry(null); setConfirmDeleteDate(null);
    gasDeleteSession(date).catch(e => console.error("GAS削除エラー:", e));
  };

  const handleSaveDiaryEdit = () => {
    if (!editingDiary) return;
    const originalDate = diary.find(d => d.songs === editingDiary.songs)?.date || editingDiary.date;
    const next = diary
      .filter(d => d !== diary.find(d2 => JSON.stringify(d2.songs) === JSON.stringify(editingDiary.songs) || d2.date === editingDiary._originalDate))
      .concat([{date: editingDiary.date, songs: editingDiary.songs}])
      .sort((a,b) => b.date.localeCompare(a.date));
    setDiary(next);
    saveDiaryToCache(next);
    setEditingDiary(null);
    // 元の日付で削除→新しい日付で追記
    if (editingDiary._originalDate && editingDiary._originalDate !== editingDiary.date) {
      gasDeleteSession(editingDiary._originalDate)
        .then(() => gasAppendSessions([{date: editingDiary.date, songs: editingDiary.songs}]))
        .catch(e => console.error("GAS更新エラー:", e));
    } else {
      gasUpdateSession(editingDiary).catch(e => console.error("GAS更新エラー:", e));
    }
  };

  const handleEditSongChange = (idx, field, value) => {

      songs: prev.songs.map((s,i) => i === idx ? {...s, [field]: value} : s)
    }));

  const handleEditSongDelete = (idx) => {
    setEditingDiary(prev => ({
      ...prev,

  const handleDeleteEvent = (id) => {

  const [confirmDeleteEventId, setConfirmDeleteEventId] = useState(null);

  // ── エクスポート ──────────────────────────────────────
  const handleExport = () => {
    const stats = {};
    diary.forEach(d => d.songs?.forEach(s => {
      if (!stats[s.number]) stats[s.number] = {title:s.title, count:0, group:s.group};
      stats[s.number].count++;
    }));
    // 年ごとに集計
    const statsByYear = {};
    diary.forEach(d => {
      const y = d.date.slice(0,4);
      if (!statsByYear[y]) statsByYear[y] = {};
      d.songs?.forEach(s => {
        if (!statsByYear[y][s.number]) statsByYear[y][s.number] = {title:s.title, count:0, group:s.group};
        statsByYear[y][s.number].count++;
      });
    });
    const years = Object.keys(statsByYear).sort();

    const lines = [
      "以下は結の会スージー三線教室のお稽古記録です。",
      "①総括として着物組・ひよこ組それぞれの全体的な傾向を2〜3文で簡潔にまとめてください。",
      "②年ごとに着物組・ひよこ組それぞれの傾向分析をしてください。傾向分析は事実に基づく内容のみとし、指示や提案は含めないでください。",
      "③イベントに向けて優先すべき曲をアドバイスしてください。",
      "結果のJSONはsummary（総括・文字列）、analysisを年→着物組・ひよこ組のキーで分けてください。",
      `例: {summary:"総括", advice:{"2025":{"着物組":"..."}}, analysis:{...}}`,
      "",
      `【総記録回数】${diary.length}回`,
      "",
      ...years.flatMap(y => {
        const ys = statsByYear[y];
        const yDiary = diary.filter(d => d.date.startsWith(y));
        return [
          `【${y}年 記録回数】${yDiary.length}回`,
          `【${y}年 曲別練習回数】`,
          ...Object.entries(ys).sort((a,b)=>b[1].count-a[1].count)

      ...diary.slice(0,4).flatMap(d => [

    ];
    setExportText(lines.join("\n"));

  const handleCopyExport = () => {

  };

  const fallbackCopy = () => {

    el.value = exportText;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    try {
      document.execCommand("copy");
      setExportCopied(true);
      setTimeout(() => setExportCopied(false), 2000);
    } catch(e) {
      console.error("コピー失敗:", e);
    }
    document.body.removeChild(el);

  // ── インポート ────────────────────────────────────────
  const handleImport = () => {

      if (match) {
        const data = JSON.parse(match[0]);
        if (data.advice || data.recommendations || data.analysis) {
          const dataWithDate = { ...data, updatedAt: new Date().toISOString().slice(0,10) };
          setImportResult(dataWithDate);
          setImportMsg("✅ インポートしました");
          setImportText("");
          // スプレッドシートに自動保存
          gasPost("saveImport", dataWithDate).catch(e => console.error("GAS保存エラー:", e));
          return;

      throw new Error("対応するデータ形式が見つかりません");
    } catch(e) { setImportMsg(`❌ ${e.message}`); }
  };

  // ── 集計 ──────────────────────────────────────────────
  const songStats = {};
  diary.forEach(d => d.songs?.forEach(s => {
    if (!songStats[s.number]) songStats[s.number] = {title:s.title, count:0, lastDate:"", firstDate:""};
    songStats[s.number].count++;
    if (!songStats[s.number].lastDate) songStats[s.number].lastDate = d.date;
    songStats[s.number].firstDate = d.date; // 降順ソート済みなので最後に出た日付が最古
  }));

  const maxSongCount = Object.values(songStats).reduce((m, s) => Math.max(m, s.count), 1);

  // 受賞履歴から曲ごとの最高位の賞と受賞者を取得
  const getAwardInfo = (num) => {
    const h = awardHistory[num];
    if (!h) return { award: null, awardees: [] };
    const priority = { "最高賞": 3, "優秀賞": 2, "新人賞": 1 };
    let topAward = null, topP = 0;
    for (const award in h) {
      if (priority[award] > topP) { topP = priority[award]; topAward = award; }
    }
    const awardees = topAward ? h[topAward].map(x => x.name) : [];
    return { award: topAward, awardees };
  };
  const canEdit = userRole === "編集者" || userRole === "管理者";
  const isAdmin = userRole === "管理者";
  const latestSession = diary[0];
  const recKimono = latestSession ? latestSession.songs.filter(s => s.group==="着物組") : [];
  const recHiyoko = latestSession ? latestSession.songs.filter(s => s.group==="ひよこ組") : [];
  // 登録日から1ヶ月以内の曲をNEW扱い
  // NEWと💫を両方useMemoで計算（songDB・diary読み込み後に正しく再計算）
  const newNums = useMemo(() => {
    const oneMonthAgo = new Date();
    oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
    const oneMonthAgoStr = oneMonthAgo.toISOString().slice(0,10);
    return new Set(
      [...recKimono,...recHiyoko]
        .filter(s => {
          const reg = songDB[s.number]?.registeredAt;
          return reg && reg >= oneMonthAgoStr;
        })
        .map(s => s.number)
    );
  }, [songDB, recKimono, recHiyoko]);

  const comebackNums = useMemo(() => {
    // 前回お稽古日を取得（diary[0]が最新）
    const lastSessionDate = latestSession ? latestSession.date : null;
    if (!lastSessionDate) return new Set();

    // 前回お稽古日の6ヶ月前
    const sixMonthsBefore = new Date(lastSessionDate);
    sixMonthsBefore.setMonth(sixMonthsBefore.getMonth() - 6);
    const sixMonthsBeforeStr = sixMonthsBefore.toISOString().slice(0,10);

    // 前回お稽古日より前の日誌で、6ヶ月間に出現した曲番号を収集
    const appearedNums = new Set(
      diary
        .filter(d => d.date >= sixMonthsBeforeStr && d.date < lastSessionDate)
        .flatMap(d => d.songs ? d.songs.map(s => s.number) : [])
    );

    // 前回候補の中で、6ヶ月間出現していない曲（NEW除く）
    return new Set(
      [...recKimono,...recHiyoko]
        .map(s => s.number)
        .filter(num => !newNums.has(num) && !appearedNums.has(num))
    );
  }, [diary, latestSession, recKimono, recHiyoko, newNums]);

  const today = new Date().toISOString().slice(0,10);
  const nextEvent = events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];

  return (
    <div id="app-scroll" style={{...S.app,overflowY:"auto",height:"100vh"}}>

      {loginStep === "done" && gasLoading && (

          <div style={{fontSize:32,marginBottom:12}}>結</div>
          {gasLoadError ? (
            <>
              <div style={{color:C.accent,fontWeight:"bold",fontSize:15}}>⚠️ データの読み込みに失敗しました</div>
              <div style={{color:C.sub,fontSize:12,marginTop:8,textAlign:"center",lineHeight:1.6}}>
                通信状況を確認して、画面を再読み込みしてください
              </div>
              <button style={{...S.btn,...S.btnPrimary,marginTop:16}}
                onClick={()=>window.location.reload()}>
                🔄 再読み込み
              </button>

          ) : (
            <>
              <div style={{color:C.teal,fontWeight:"bold",fontSize:15}}>データを読み込んでいます...</div>
              <div style={{color:C.sub,fontSize:12,marginTop:6}}>通信状況によって少し時間がかかります</div>
            </>
          )}
        </div>
      )}

      {/* ── ログインモーダル（データ読み込み中も即表示） ── */}
      {loginStep !== "done" && (
        <div style={{position:"fixed",inset:0,background:"rgba(26,107,90,0.95)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:998,padding:24}}>
          <div style={{fontSize:40,color:"#f0c040",marginBottom:8,fontFamily:"'Hiragino Sans','Yu Gothic',sans-serif",fontWeight:"bold"}}>ス</div>
          <div style={{color:"#fff",fontSize:16,fontWeight:"bold",marginBottom:4}}>結の会スージー三線教室</div>

          {/* 今日の日付と直近イベント */}

            </div>
            {events.filter(ev=>ev.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date))[0] && (() => {
              const ev = events.filter(ev=>ev.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date))[0];
              const d = new Date(ev.date);

                <div style={{display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end"}}>
                  <span style={{display:"inline-block",animation:"ring 1.5s ease-in-out infinite",fontSize:12}}>📣</span>
                  <span style={S.eventBadgeSub}>{dateLabel} {nextEvent.title}</span>
                </div>

function AdviceBlock({data}) {
  if (!data) return null;
  if (typeof data === "string") return <div style={S.importText}>{data}</div>;
  const keys = Object.keys(data).sort().reverse();
  const isYearly = keys.every(k => k.length === 4 && !isNaN(k));
  if (isYearly) {
    return (
      <div>
        {keys.map(yr => (
          <div key={yr} style={{marginBottom:12}}>
            <div style={{fontWeight:"bold",color:C.gold,fontSize:13,marginBottom:4}}>📅 {yr}年</div>
            {data[yr] && data[yr]["着物組"] && (
              <div style={{marginBottom:6}}>
                <div style={S.groupLabel}>👘 着物組</div>
                <div style={{...S.importText,marginTop:4}}>{data[yr]["着物組"]}</div>
              </div>
            )}
            {data[yr] && data[yr]["ひよこ組"] && (
              <div>
                <div style={S.groupLabel}>🐥 ひよこ組</div>
                <div style={{...S.importText,marginTop:4}}>{data[yr]["ひよこ組"]}</div>
              </div>
            )}
          </div>
        ))}
      </div>
    );
  }
  return (
    <div>
      {data["着物組"] && (
        <div style={{marginBottom:8}}>
          <div style={S.groupLabel}>👘 着物組</div>
          <div style={{...S.importText,marginTop:6}}>{data["着物組"]}</div>
        </div>
      )}
      {data["ひよこ組"] && (
        <div>
          <div style={S.groupLabel}>🐥 ひよこ組</div>
          <div style={{...S.importText,marginTop:6}}>{data["ひよこ組"]}</div>
        </div>
      )}
    </div>
  );
}

function SongRow({song, highlight, songDB=SONG_DB, onSongInfo=null, onSearch=null}) {
  const isUnknown = !songDB[song.number] || highlight;
  const audioUrl = songDB[song.number]?.audioUrl;
  const info = songDB[song.number];
  return (
    <div style={{...S.songRow, borderLeft: isUnknown ? "3px solid #e67e22" : `3px solid ${C.gold}`, background: isUnknown ? "#fff8f0" : "#faf7f2"}}>
      <span style={S.songOrder}>#{song.order}</span>
      <span style={{...S.songNum, background: isUnknown ? "#e67e22" : C.border, color: isUnknown ? "#fff" : C.sub,
        cursor: onSongInfo&&info ? "pointer" : "default",
        textDecoration: onSongInfo&&info ? "underline" : "none"}}
        onClick={()=>{ if(onSongInfo&&info) onSongInfo(song.number, info); }}>{song.number}</span>
      <span style={S.songTitle}>{song.title} {chindamiIcon(songDB[song.number]?.chindami)}</span>
      {isUnknown && <span style={{fontSize:10,color:"#e67e22",fontWeight:"bold",whiteSpace:"nowrap"}}>⚠️ 未登録</span>}
      {audioUrl
        ? <a href={audioUrl.replace("/view","/preview")} target="_blank" rel="noreferrer"
            style={{...S.taruBtn,textDecoration:"none",border:`1px solid ${C.teal}`,color:C.teal,padding:"4px 6px",fontSize:12}}>🎵</a>
        : <span style={{...S.taruBtn,color:"#ccc",border:"1px solid #eee",padding:"4px 6px",fontSize:12}}>➖</span>
      }
      {onSearch && <button style={S.taruBtn} onClick={()=>onSearch(song.title)}>🔍</button>}
    </div>
  );
}
