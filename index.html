  return `https://www.google.com/search?q=site:taru.ti-da.net+${encodeURIComponent(title)}`;
}

function getMastery(count) {
  if (count >= 10) return { stage: "🏆 暗譜完璧", color: "#d4af37", bg: "#fffbea" };
  if (count >= 7)  return { stage: "⭐ 仕上げ",   color: "#e67e22", bg: "#fef5ec" };
  if (count >= 5)  return { stage: "📈 定着中",   color: "#27ae60", bg: "#eafaf1" };
  if (count >= 3)  return { stage: "🎵 練習中",   color: "#2980b9", bg: "#eaf4fb" };
  return           { stage: "🌱 導入",            color: "#7f8c8d", bg: "#f4f6f7" };
}

function toHankaku(str) {
  return str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
}

function extractDate(line, year) {
  const l = toHankaku(line);
  let m = l.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m = l.match(/(\d{1,2})月\s*(\d{1,2})\s*日/);
  if (m) return `${year}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  m = l.match(/\b(\d{1,2})\/(\d{1,2})\b/);
  if (m) return `${year}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  return null;
}

function normalizeNumber(raw) {
  return String(raw).replace(/[-－].+$/, "").padStart(3, "0");
}

function generateTemplate(session) {
  if (!session) return "";
  const today = new Date();
  const y = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  const kimono = session.songs.filter(s => s.group === "着物組");
  const hiyoko = session.songs.filter(s => s.group === "ひよこ組");
  return [
    `${y}/${mm}/${dd}のお稽古曲です`,
    "",
    "第一部",
    ...kimono.map(s => `${parseInt(s.number)} ${s.title}`),
    "",
    "第二部",
    ...hiyoko.map(s => `${parseInt(s.number)} ${s.title}`),
    "",
    "以上でした〜",
  ].join("\n");
}

function parseLineText(text, overrideDate) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const year = new Date().getFullYear();
  const blocks = [];
  let current = null;
  for (const line of lines) {
    const d = extractDate(line, year);
    if (d) {
      current = { date: d, dateFound: true, lines: [] };
      blocks.push(current);
    } else if (current) {
      current.lines.push(line);
    }
  }
  if (blocks.length === 0) {
    blocks.push({ date: new Date().toISOString().slice(0,10), dateFound: false, lines });
  }
  const results = blocks.map(block => {
    const songs = [];
    let group = "着物組";
    let order = 1;
    for (const line of block.lines) {
      if (/第?[2二]部|後半|ひよこ組/.test(line)) { group = "ひよこ組"; continue; }
      if (/第?[1一]部|前半|着物組/.test(line)) { group = "着物組"; continue; }
      const sm = line.match(/^(\d{1,3}[-－]?\d*)\s*(.+)/);
      if (sm) {
        const num = normalizeNumber(sm[1]);
        const titleRaw = sm[2].replace(/🆕/g,"").replace(/[\u{1F300}-\u{1FFFF}]/gu,"").trim();
        songs.push({ order: order++, number: num, title: SONG_DB[num]?.title || titleRaw, group });
      }
    }
    return { date: overrideDate || block.date, dateFound: block.dateFound, songs };
  }).filter(r => r.songs.length > 0);
  if (results.length === 0) throw new Error("曲が見つかりませんでした");
  return results;
}

function lastSunday(year, month) {
  const last = new Date(year, month, 0);
  while (last.getDay() !== 0) last.setDate(last.getDate() - 1);
  const y = last.getFullYear();
  const m = String(last.getMonth()+1).padStart(2,"0");
  const d = String(last.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

// 環境判別: GitHub Pagesならスプレッドシート連携、それ以外はハードコード
const IS_PRODUCTION = typeof location !== "undefined" &&
  location.hostname === "zephra0911.github.io";

const GAS_URL = "https://script.google.com/macros/s/AKfycbzE1OoXs3H47LbfW1X_Hu25wNNoqNrWzpl3di_WOx-2VQNmtObX-YF2XDDUSH2rm8h1/exec";

async function gasGet(action) {
  const res = await fetch(`${GAS_URL}?action=${action}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function gasPost(action, data) {
  // Artifact環境では保存しない
  if (!IS_PRODUCTION) return { success: true, skipped: true };
  // GitHub Pages: GETパラメータ方式で保存（CORS対策）
  const key = action === "saveDiary" ? "diary"
    : action === "saveEvents" ? "events"
    : action === "saveImport" ? "importResult" : null;
  if (!key) throw new Error("unknown action");
  const params = new URLSearchParams({
    action: "saveAll",
    [key]: encodeURIComponent(JSON.stringify(data)),
  });
  const res = await fetch(`${GAS_URL}?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

    (async () => {
      if (IS_PRODUCTION) {
        // GitHub Pages: スプレッドシートから読み込む
        try {
          const [diaryData, eventsData, importData, songsData] = await Promise.all([
            gasGet("getDiary"),
            gasGet("getEvents"),

          ]);
          // 曲マスタをSONG_DBに反映
          if (songsData && Object.keys(songsData).length > 0) {

          if (Array.isArray(diaryData) && diaryData.length > 0) {
            setDiary(diaryData);
          } else {
            // シートが空の場合はINITIAL_DIARYで初期化して保存
            setDiary(INITIAL_DIARY);
            gasPost("saveDiary", INITIAL_DIARY).catch(e => console.error("初期化保存エラー:", e));
          }
          if (Array.isArray(eventsData) && eventsData.length > 0) {
            setEvents(eventsData);
          } else {
            // イベントも空なら初期データで保存
            gasPost("saveEvents", BASE_EVENTS).catch(e => console.error("イベント初期化エラー:", e));
          }
          if (importData) setImportResult(importData);
        } catch(e) {
          console.error("GAS読み込みエラー:", e);
          setDiary(INITIAL_DIARY);
        }
      } else {
        // Artifact: ハードコードデータを使用
        setDiary(INITIAL_DIARY);
      }
      setGasLoading(false);
    })();
  });

  // ── GAS連携 ──────────────────────────────────────────
  const handleLoadFromGAS = async () => {
    setGasSyncing(true);
    setGasStatus("");
    try {
      const [diaryData, eventsData, importData] = await Promise.all([
        gasGet("getDiary"),
        gasGet("getEvents"),
        gasGet("getImport"),
      ]);
      if (Array.isArray(diaryData) && diaryData.length > 0) { setDiary(diaryData); }
      if (Array.isArray(eventsData) && eventsData.length > 0) { setEvents(eventsData); }
      if (importData) { setImportResult(importData); }
      setGasStatus(`✅ 読み込み完了（日誌${Array.isArray(diaryData)?diaryData.length:0}回）`);
    } catch(e) {
      setGasStatus(`❌ 読み込み失敗: ${e.message}`);
    }
    setGasSyncing(false);
  };

  const handleSaveToGAS = async () => {
    setGasSyncing(true);
    setGasStatus("");
    try {
      const result = await gasPost("saveDiary", diary);
      if (result.success) {
        setGasStatus(`✅ ${diary.length}回分を保存しました`);
      } else {
        setGasStatus(`❌ 保存失敗: ${result.error}`);

      setGasStatus(`❌ 保存失敗: ${e.message}`);
    }
    setGasSyncing(false);
  };

  // ── 日誌解析 ──────────────────────────────────────────
  const handleAnalyze = () => {
    if (!lineText.trim()) return;
    setParseError(""); setParseResults([]);
    try {
      const results = parseLineText(lineText);
      if (results.some(r => !r.dateFound)) {
        setDateModalDate(new Date().toISOString().slice(0,10));
        setShowDateModal(true);
        setPendingResults(results);
        return;
      }
      setParseResults(results);
    } catch(e) { setParseError(e.message); }
  };

  const handleDateConfirm = (date) => {
    setParseResults(pendingResults.map(r => !r.dateFound ? {...r, date} : r));
    setPendingResults([]); setShowDateModal(false);
  };

  const handleSaveDiary = () => {
    if (!parseResults.length) return;
    let next = [...diary];
    for (const r of parseResults) {
      const idx = next.findIndex(d => d.date === r.date);
      if (idx >= 0) next[idx] = r; else next.push(r);
    }
    next = next.sort((a,b) => b.date.localeCompare(a.date));
    setDiary(next);
    setParseResults([]); setLineText(""); setTab("history");
    gasPost("saveDiary", next).catch(e => console.error("GAS保存エラー:", e));
  };

  // ── 履歴編集・削除 ────────────────────────────────────
  const handleDeleteDiary = (date) => {
    const next = diary.filter(d => d.date !== date);
    setDiary(next);
    setSelectedEntry(null); setConfirmDeleteDate(null);
    gasPost("saveDiary", next).catch(e => console.error("GAS保存エラー:", e));
  };

  const handleSaveDiaryEdit = () => {
    if (!editingDiary) return;
    const next = diary.map(d => d.date === editingDiary.date ? editingDiary : d);
    setDiary(next);
    setEditingDiary(null);
    gasPost("saveDiary", next).catch(e => console.error("GAS保存エラー:", e));
  };

  const handleEditSongChange = (idx, field, value) => {
    setEditingDiary(prev => ({
      ...prev,
      songs: prev.songs.map((s,i) => i === idx ? {...s, [field]: value} : s)
    }));
  };

  const handleEditSongDelete = (idx) => {
    setEditingDiary(prev => ({
      ...prev,
      songs: prev.songs.filter((_,i) => i !== idx).map((s,i) => ({...s, order:i+1}))
    }));
  };

  const handleEditSongAdd = (group) => {
    setEditingDiary(prev => ({
      ...prev,
      songs: [...prev.songs, {order:prev.songs.length+1, number:"", title:"", group}]
    }));
  };

  // ── エクスポート ──────────────────────────────────────
  const handleExport = () => {
    const stats = {};
    diary.forEach(d => d.songs?.forEach(s => {
      if (!stats[s.number]) stats[s.number] = {title:s.title, count:0, group:s.group};
      stats[s.number].count++;
    }));
    const lines = [
      "以下は結の会スージー三線教室のお稽古記録です。",
      "①着物組・ひよこ組それぞれについて、同じ分量で練習アドバイスをしてください。",
      "②着物組・ひよこ組それぞれの最近の練習傾向を分析してください。",
      "③イベントに向けて優先すべき曲をアドバイスしてください。",
      "結果のJSONはadvice・analysisを着物組・ひよこ組のキーで分けてください。",
      "",
      `【記録回数】${diary.length}回`,
      "",
      "【曲別練習回数】",
      ...Object.entries(stats).sort((a,b)=>b[1].count-a[1].count)
        .map(([num,info]) => `  ${num} ${info.title}（${info.group}）: ${info.count}回`),
      "",
      "【直近4回のお稽古】",
      ...diary.slice(0,4).flatMap(d => [
        `  ${d.date}`,
        ...d.songs.map(s => `    ${s.number} ${s.title}（${s.group}）`),

    ];
    setExportText(lines.join("\n"));

  const handleCopyExport = () => {
    navigator.clipboard?.writeText(exportText);

  // ── インポート ────────────────────────────────────────
  const handleImport = () => {

      const match = importText.match(/\{[\s\S]*\}/);

        gasPost("saveImport", data).catch(e => console.error("GAS保存エラー:", e));
        return;

                      <button style={{fontSize:11,padding:"2px 8px",borderRadius:6,border:`1px solid ${C.accent}`,background:"transparent",color:C.accent,cursor:"pointer"}}

                    <input type="text" style={S.dateInput} placeholder="場所"

                <button style={{...S.btn,background:C.teal,color:"#fff",flex:1,opacity:gasSyncing?0.7:1}}
                  onClick={handleLoadFromGAS} disabled={gasSyncing}>
                  {gasSyncing?"⏳ 処理中...":"📥 シートから読込"}
                </button>
                <button style={{...S.btn,background:C.gold,color:"#fff",flex:1,opacity:gasSyncing?0.7:1}}
                  onClick={handleSaveToGAS} disabled={gasSyncing}>
                  {gasSyncing?"⏳ 処理中...":"📤 シートへ保存"}
                </button>
              </div>
              {gasStatus && (
                <div style={{fontSize:13,color:gasStatus.startsWith("✅")?C.teal:gasStatus.startsWith("⚠️")?"#f39c12":C.accent}}>
                  {gasStatus}
                </div>
              )}
            </div>

            {/* アドバイス */}
            <div style={S.adviceCard}>
              <div style={S.adviceHeader}>💬 アドバイス</div>
              {importResult?.advice
                ? typeof importResult.advice === "object"
                  ? <>
                      {importResult.advice["着物組"] && (
                        <div style={{marginBottom:8}}>
                          <div style={S.groupLabel}>🪸 着物組</div>
                          <div style={{...S.importText,marginTop:6}}>{importResult.advice["着物組"]}</div>
                        </div>
                      )}
                      {importResult.advice["ひよこ組"] && (
                        <div>
                          <div style={S.groupLabel}>🐣 ひよこ組</div>
                          <div style={{...S.importText,marginTop:6}}>{importResult.advice["ひよこ組"]}</div>
                        </div>
                      )}
                    </>
                  : <div style={S.importText}>{importResult.advice}</div>
                : <div style={{fontSize:12,color:C.sub}}>解析結果をインポートすると表示されます。</div>
              }
            </div>

            {/* 傾向分析 */}
            <div style={S.adviceCard}>
              <div style={S.adviceHeader}>📊 傾向分析</div>
              {importResult?.analysis
                ? typeof importResult.analysis === "object"
                  ? <>
                      {importResult.analysis["着物組"] && (
                        <div style={{marginBottom:8}}>
                          <div style={S.groupLabel}>🪸 着物組</div>
                          <div style={{...S.importText,marginTop:6}}>{importResult.analysis["着物組"]}</div>
                        </div>
                      )}
                      {importResult.analysis["ひよこ組"] && (
                        <div>
                          <div style={S.groupLabel}>🐣 ひよこ組</div>
                          <div style={{...S.importText,marginTop:6}}>{importResult.analysis["ひよこ組"]}</div>
                        </div>
                      )}
                    </>
                  : <div style={S.importText}>{importResult.analysis}</div>
                : <div style={{fontSize:12,color:C.sub}}>解析結果をインポートすると表示されます。</div>
              }
            </div>

            {/* エクスポート */}
            <div style={S.adviceCard}>
              <div style={S.adviceHeader}>📤 Claude.aiで解析する</div>
              <p style={{...S.hint,margin:0}}>蓄積データをエクスポートしてClaude.aiに貼り付けると練習アドバイスを取得できます。</p>
              <button style={{...S.btn,...S.btnPrimary}} onClick={handleExport}>📋 解析用テキストを生成</button>
              {exportText && (
                <>
                  <textarea readOnly style={{...S.textarea,minHeight:180,fontSize:11,background:"#f8f8f8"}} value={exportText}/>
                  <button style={{...S.btn,background:exportCopied?"#27ae60":C.teal,color:"#fff"}} onClick={handleCopyExport}>
                    {exportCopied?"✅ コピーしました！":"📋 全文コピー"}
                  </button>
                </>
              )}
            </div>

            {/* インポート */}
            <div style={S.adviceCard}>
              <div style={S.adviceHeader}>📥 解析結果をインポート</div>
              <p style={{...S.hint,margin:0}}>Claude.aiの分析結果JSONを貼り付けてください。</p>
              <textarea style={{...S.textarea,minHeight:100}} placeholder='{"advice":"...","analysis":"..."}'
                value={importText} onChange={e=>setImportText(e.target.value)}/>
              <button style={{...S.btn,...S.btnPrimary}} onClick={handleImport}>📥 読み込む</button>
              {importMsg && <div style={{fontSize:13,color:importMsg.startsWith("✅")?C.teal:C.accent}}>{importMsg}</div>}
            </div>
          </div>
        )}

      </main>

      {/* ── 日付入力モーダル ── */}
      {showDateModal && (
        <div style={S.modalOverlay}>
          <div style={S.modalBox}>
            <div style={S.modalTitle}>📅 日付を入力してください</div>
            <p style={S.hint}>テキストから日付を読み取れませんでした。</p>
            <input type="date" style={S.dateInput} value={dateModalDate} onChange={e=>setDateModalDate(e.target.value)}/>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{...S.btn,...S.btnSuccess,flex:1}} onClick={()=>handleDateConfirm(dateModalDate)} disabled={!dateModalDate}>✅ この日付で解析</button>
              <button style={{...S.btn,...S.btnGhost}} onClick={()=>{setShowDateModal(false);setPendingResults([])}}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── 削除確認モーダル ── */}
      {confirmDeleteDate && (
        <div style={S.modalOverlay} onClick={()=>setConfirmDeleteDate(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>🗑️ 削除の確認</div>
            <p style={{fontSize:14,color:C.text,margin:0}}><strong>{confirmDeleteDate}</strong> の記録を削除しますか？</p>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{...S.btn,background:C.accent,color:"#fff",flex:1}} onClick={()=>handleDeleteDiary(confirmDeleteDate)}>🗑️ 削除する</button>
              <button style={{...S.btn,...S.btnGhost,flex:1}} onClick={()=>setConfirmDeleteDate(null)}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── 日誌編集モーダル ── */}
      {editingDiary && (
        <div style={S.modalOverlay} onClick={()=>setEditingDiary(null)}>
          <div style={{...S.modalBox,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>✏️ {editingDiary.date} を編集</div>
            {["着物組","ひよこ組"].map(grp=>(
              <div key={grp} style={{marginTop:12}}>
                <div style={S.groupLabel}>{grp==="着物組"?"🪸 着物組":"🐣 ひよこ組"}</div>
                {editingDiary.songs.filter(s=>s.group===grp).map(s=>{
                  const gi=editingDiary.songs.indexOf(s);
                  return (
                    <div key={gi} style={{display:"flex",gap:6,alignItems:"center",marginTop:6}}>
                      <input style={{...S.dateInput,width:52,padding:"6px 8px",fontSize:12}} placeholder="番号"
                        value={s.number}
                        onChange={e=>{
                          const num=String(e.target.value).padStart(3,"0");
                          handleEditSongChange(gi,"number",e.target.value);
                          if(SONG_DB[num]) handleEditSongChange(gi,"title",SONG_DB[num].title);
                        }}/>
                      <input style={{...S.dateInput,flex:1,padding:"6px 8px",fontSize:12}} placeholder="曲名"
                        value={s.title} onChange={e=>handleEditSongChange(gi,"title",e.target.value)}/>
                      <button style={{fontSize:12,padding:"4px 8px",borderRadius:6,border:`1px solid ${C.accent}`,background:"transparent",color:C.accent,cursor:"pointer"}}
                        onClick={()=>handleEditSongDelete(gi)}>🗑️</button>
                    </div>
                  );
                })}
                <button style={{...S.taruBtn,marginTop:8,color:C.teal,border:`1px solid ${C.teal}`}}
                  onClick={()=>handleEditSongAdd(grp)}>＋ 曲を追加</button>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button style={{...S.btn,...S.btnSuccess,flex:1}} onClick={handleSaveDiaryEdit}>✅ 保存</button>
              <button style={{...S.btn,...S.btnGhost}} onClick={()=>setEditingDiary(null)}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── たるーモーダル ── */}
      {taruModal && (
        <div style={S.modalOverlay} onClick={()=>setTaruModal(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>🎵 {taruModal.title}</div>
            <p style={{fontSize:12,color:C.sub,margin:"0 0 12px"}}>「たるーの島唄まじめな研究」で解説を検索します。</p>
            <a href={taruGoogleUrl(taruModal.title)} target="_blank" rel="noreferrer"
              style={{...S.btn,...S.btnPrimary,textDecoration:"none",textAlign:"center",display:"block"}}>
              🔍 Google で検索する
            </a>
            <button style={{...S.btn,...S.btnGhost,marginTop:8,width:"100%"}} onClick={()=>setTaruModal(null)}>閉じる</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SongRow({song}) {
  return (
    <div style={{...S.songRow}}>
      <span style={S.songOrder}>#{song.order}</span>
      <span style={S.songNum}>{song.number}</span>
      <span style={S.songTitle}>{song.title}</span>
    </div>
  );
}

function typeColor(type) {
  return {"発表会":"#c0392b","演奏会":"#16a085","外部演奏":"#8e44ad","表彰式":"#d4830a"}[type]||"#7f8c8d";
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SanshinApp />);
