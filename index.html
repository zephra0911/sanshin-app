function taruGoogleUrl(title) {
  return `https://www.google.com/search?q=${encodeURIComponent(title)}+%E5%94%84+%E5%88%86%E6%9E%90`;
}

function getMastery(count) {
  if (count >= 10) return { stage: "🏆 暗譜完璧", color: "#d4af37", bg: "#fffbea" };
  if (count >= 7)  return { stage: "⭐ 仕上げ",   color: "#e67e22", bg: "#fef5ec" };
  if (count >= 5)  return { stage: "📈 定着中",   color: "#27ae60", bg: "#eafaf1" };
  if (count >= 3)  return { stage: "🎵 練習中",   color: "#2980b9", bg: "#eaf4fb" };
  return           { stage: "🌱 導入",            color: "#7f8c8d", bg: "#f4f6f7" };
}

function toHankaku(str) {
  return str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
}

function extractDate(line, year) {
  const l = toHankaku(line);
  const today = new Date().toISOString().slice(0,10);

  const adjustYear = (dateStr) => {
    // 未来日付なら昨年として扱う
    if (dateStr > today) {
      return `${parseInt(dateStr.slice(0,4)) - 1}${dateStr.slice(4)}`;
    }
    return dateStr;
  };

  // YYYY/MM/DD or YYYY-MM-DD: 年が明示されているのでそのまま使用
  let m = l.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  // YYYY年M月D日: 年が明示されているのでそのまま使用
  m = l.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})\s*日/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  // M月D日: 年なしなので未来日付チェックあり
  m = l.match(/(\d{1,2})月\s*(\d{1,2})\s*日/);
  if (m) return adjustYear(`${year}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`);
  // M/D: 年なしなので未来日付チェックあり
  m = l.match(/(\d{1,2})\/(\d{1,2})/);
  if (m) return adjustYear(`${year}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`);
  return null;
}

function normalizeNumber(raw) {
  return String(raw).replace(/[-－].+$/, "").padStart(3, "0");
}

function generateTemplate(session) {
  if (!session) return "";
  const today = new Date();
  const y = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  const kimono = session.songs.filter(s => s.group === "着物組");
  const hiyoko = session.songs.filter(s => s.group === "ひよこ組");
  return [
    `${y}/${mm}/${dd}のお稽古曲です`,
    "",
    "第一部",
    ...kimono.map(s => `${parseInt(s.number)} ${s.title}`),
    "",
    "第二部",
    ...hiyoko.map(s => `${parseInt(s.number)} ${s.title}`),
    "",
    "以上でした〜",
  ].join("\n");
}

function parseLineText(text, overrideDate) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const year = new Date().getFullYear();
  const blocks = [];
  let current = null;
  for (const line of lines) {
    const d = extractDate(line, year);
    if (d) {
      current = { date: d, dateFound: true, lines: [] };
      blocks.push(current);
    } else if (current) {
      current.lines.push(line);
    }
  }
  if (blocks.length === 0) {
    blocks.push({ date: new Date().toISOString().slice(0,10), dateFound: false, lines });
  }
  const results = blocks.map(block => {
    const songs = [];
    let group = "着物組";
    let order = 1;
    for (const line of block.lines) {
      if (/第?[2二]部|後半|ひよこ組/.test(line)) { group = "ひよこ組"; continue; }
      if (/第?[1一]部|前半|着物組/.test(line)) { group = "着物組"; continue; }
      const sm = line.match(/^(\d{1,3}[-－]?\d*)\s*(.+)/);
      if (sm) {
        const num = normalizeNumber(sm[1]);
        const titleRaw = sm[2].replace(/🆕/g,"").replace(/[\u{1F300}-\u{1FFFF}]/gu,"").trim();
        const titleFromDB = SONG_DB[num]?.title;
        // SONG_DBにない場合は自動追加
        if (!titleFromDB && titleRaw && titleRaw.length > 1) {
          SONG_DB[num] = { title: titleRaw };
          gasSaveSong(num, titleRaw);
        }
        songs.push({ order: order++, number: num, title: titleFromDB || titleRaw, group });
      }
    }
    return { date: overrideDate || block.date, dateFound: block.dateFound, songs };
  }).filter(r => r.songs.length > 0);
  if (results.length === 0) throw new Error("曲が見つかりませんでした");
  return results;
}

function lastSunday(year, month) {
  const last = new Date(year, month, 0);
  while (last.getDay() !== 0) last.setDate(last.getDate() - 1);
  const y = last.getFullYear();
  const m = String(last.getMonth()+1).padStart(2,"0");
  const d = String(last.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

// ── Google Apps Script API ───────────────────────────
// 環境判別: GitHub Pagesならスプレッドシート連携、それ以外はハードコード
const IS_PRODUCTION = typeof location !== "undefined" &&
  location.hostname === "zephra0911.github.io";

const GAS_URL = "https://script.google.com/macros/s/AKfycbzE1OoXs3H47LbfW1X_Hu25wNNoqNrWzpl3di_WOx-2VQNmtObX-YF2XDDUSH2rm8h1/exec";

async function gasGet(action) {
  const res = await fetch(`${GAS_URL}?action=${action}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function gasSaveSong(number, title) {
  if (!IS_PRODUCTION) return;
  const params = new URLSearchParams({
    action: "saveAll",
    newSong: encodeURIComponent(JSON.stringify({ number, title })),
  });
  fetch(`${GAS_URL}?${params}`).catch(e => console.error("曲追加エラー:", e));
}

// セッション追記
async function gasAppendSessions(sessions) {
  if (!IS_PRODUCTION) return;
  for (const session of sessions) {
    const params = new URLSearchParams({
      action: "appendSession",
      date: session.date,
      songs: encodeURIComponent(JSON.stringify(session.songs)),
    });
    const res = await fetch(`${GAS_URL}?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }
}

// セッション削除
async function gasDeleteSession(date) {
  if (!IS_PRODUCTION) return;
  const params = new URLSearchParams({ action: "deleteSession", date });
  const res = await fetch(`${GAS_URL}?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

// セッション更新（削除→追記）
async function gasUpdateSession(session) {
  if (!IS_PRODUCTION) return;
  await gasDeleteSession(session.date);
  await gasAppendSessions([session]);
}

function gasPost(action, data) {
  if (!IS_PRODUCTION) return Promise.resolve({ success: true, skipped: true });
  var key = action === "saveDiary" ? "diary"
    : action === "saveEvents" ? "events"
    : action === "saveImport" ? "importResult" : null;
  if (!key) return Promise.reject(new Error("unknown action"));
  var jsonStr = JSON.stringify(data);
  // チャンク分割送信（URLの長さ制限を回避）
  var CHUNK = 500;
  var chunks = [];
  for (var i = 0; i < jsonStr.length; i += CHUNK) chunks.push(jsonStr.slice(i, i+CHUNK));
  var promise = Promise.resolve();
  chunks.forEach(function(chunk, idx) {
    promise = promise.then(function() {
      var url = GAS_URL + "?action=saveChunk"
        + "&key=" + encodeURIComponent(key)
        + "&chunk=" + encodeURIComponent(chunk)
        + "&index=" + idx
        + "&total=" + chunks.length;
      return fetch(url).then(function(r){ return r.json(); });
    });
  });
  return promise.then(function() {
    var url = GAS_URL + "?action=commitChunk&key=" + encodeURIComponent(key);
    return fetch(url).then(function(r){ return r.json(); });
  });
}

        </div>
      )}

      {/* ── 削除確認モーダル ── */}
      {confirmDeleteDate && (
        <div style={S.modalOverlay} onClick={()=>setConfirmDeleteDate(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>🗑️ 削除の確認</div>
            <p style={{fontSize:14,color:C.text,margin:0}}><strong>{confirmDeleteDate}</strong> の記録を削除しますか？</p>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{...S.btn,background:C.accent,color:"#fff",flex:1}} onClick={()=>handleDeleteDiary(confirmDeleteDate)}>🗑️ 削除する</button>
              <button style={{...S.btn,...S.btnGhost,flex:1}} onClick={()=>setConfirmDeleteDate(null)}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── 日誌編集モーダル ── */}
      {editingDiary && (
        <div style={S.modalOverlay} onClick={()=>setEditingDiary(null)}>
          <div style={{...S.modalBox,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>✏️ お稽古日誌を編集</div>
            <input type="date" style={S.dateInput}
              value={editingDiary.date}
              onChange={e=>setEditingDiary({...editingDiary, date:e.target.value})}/>
            {["着物組","ひよこ組"].map(grp=>(
              <div key={grp} style={{marginTop:12}}>
                <div style={S.groupLabel}>{grp==="着物組"?"🪸 着物組":"🐣 ひよこ組"}</div>
                {editingDiary.songs.filter(s=>s.group===grp).map(s=>{
                  const gi=editingDiary.songs.indexOf(s);
                  return (
                    <div key={gi} style={{display:"flex",gap:6,alignItems:"center",marginTop:6}}>
                      <input style={{...S.dateInput,width:52,padding:"6px 8px",fontSize:12}} placeholder="番号"
                        value={s.number}
                        onChange={e=>{
                          const raw = toHankaku(e.target.value);
                          const num = String(raw).padStart(3,"0");
                          handleEditSongChange(gi,"number",raw);
                          if(SONG_DB[num]) handleEditSongChange(gi,"title",SONG_DB[num].title);
                        }}/>
                      <input style={{...S.dateInput,flex:1,padding:"6px 8px",fontSize:12}} placeholder="曲名"
                        value={s.title} onChange={e=>handleEditSongChange(gi,"title",e.target.value)}/>
                      <button style={{fontSize:12,padding:"4px 8px",borderRadius:6,border:`1px solid ${C.accent}`,background:"transparent",color:C.accent,cursor:"pointer"}}
                        onClick={()=>handleEditSongDelete(gi)}>🗑️</button>
                    </div>
                  );
                })}
                <button style={{...S.taruBtn,marginTop:8,color:C.teal,border:`1px solid ${C.teal}`}}
                  onClick={()=>handleEditSongAdd(grp)}>＋ 曲を追加</button>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button style={{...S.btn,...S.btnSuccess,flex:1}} onClick={handleSaveDiaryEdit}>✅ 保存</button>
              <button style={{...S.btn,...S.btnGhost}} onClick={()=>setEditingDiary(null)}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── イベント追加モーダル ── */}
      {showAddEvent && (
        <div style={S.modalOverlay} onClick={()=>setShowAddEvent(false)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>＋ イベントを追加</div>
            <input type="text" style={S.dateInput} placeholder="イベント名（必須）"
              value={newEvent.title} onChange={e=>setNewEvent({...newEvent,title:e.target.value})}/>
            <input type="date" style={S.dateInput}
              value={newEvent.date} onChange={e=>setNewEvent({...newEvent,date:e.target.value})}/>
            <input type="text" style={S.dateInput} placeholder="時間（例: 14:00〜16:00）"
              value={newEvent.time} onChange={e=>setNewEvent({...newEvent,time:e.target.value})}/>
            <input type="text" style={S.dateInput} placeholder="場所"
              value={newEvent.place} onChange={e=>setNewEvent({...newEvent,place:e.target.value})}/>
            <div style={{display:"flex",gap:8}}>
              <button style={{...S.btn,flex:1,background:newEvent.confirmed?C.teal:C.border,color:newEvent.confirmed?"#fff":C.text}}
                onClick={()=>setNewEvent({...newEvent,confirmed:true})}>✅ 確定</button>
              <button style={{...S.btn,flex:1,background:!newEvent.confirmed?"#f39c12":C.border,color:!newEvent.confirmed?"#fff":C.text}}
                onClick={()=>setNewEvent({...newEvent,confirmed:false})}>🔸 仮</button>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button style={{...S.btn,...S.btnSuccess,flex:1}}
                onClick={handleAddEvent}
                disabled={!newEvent.title||!newEvent.date}>
                ✅ 追加する
              </button>
              <button style={{...S.btn,...S.btnGhost}} onClick={()=>setShowAddEvent(false)}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── イベント削除確認モーダル ── */}
      {confirmDeleteEventId && (
        <div style={S.modalOverlay} onClick={()=>setConfirmDeleteEventId(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>🗑️ 削除の確認</div>
            <p style={{fontSize:14,color:C.text,margin:0}}>
              <strong>{events.find(e=>e.id===confirmDeleteEventId)?.title}</strong> を削除しますか？
            </p>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{...S.btn,background:C.accent,color:"#fff",flex:1}}
                onClick={()=>{handleDeleteEvent(confirmDeleteEventId);setConfirmDeleteEventId(null);}}>
                🗑️ 削除する
              </button>
              <button style={{...S.btn,...S.btnGhost,flex:1}} onClick={()=>setConfirmDeleteEventId(null)}>キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* ── たるーモーダル ── */}
      {taruModal && (
        <div style={S.modalOverlay} onClick={()=>setTaruModal(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <div style={S.modalTitle}>🎵 {taruModal.title}</div>
            <p style={{fontSize:12,color:C.sub,margin:"0 0 12px"}}>Googleで曲の解説を検索します。</p>
            <a href={taruGoogleUrl(taruModal.title)} target="_blank" rel="noreferrer"
              style={{...S.btn,...S.btnPrimary,textDecoration:"none",textAlign:"center",display:"block"}}>
              🔍 Google で検索する
            </a>
            <button style={{...S.btn,...S.btnGhost,marginTop:8,width:"100%"}} onClick={()=>setTaruModal(null)}>閉じる</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdviceBlock({data}) {
  if (!data) return null;
  if (typeof data === "string") return <div style={S.importText}>{data}</div>;
  const keys = Object.keys(data).sort().reverse();
  const isYearly = keys.every(k => k.length === 4 && !isNaN(k));
  if (isYearly) {
    return (
      <div>
        {keys.map(yr => (
          <div key={yr} style={{marginBottom:12}}>
            <div style={{fontWeight:"bold",color:C.gold,fontSize:13,marginBottom:4}}>📅 {yr}年</div>
            {data[yr] && data[yr]["着物組"] && (
              <div style={{marginBottom:6}}>
                <div style={S.groupLabel}>🪸 着物組</div>
                <div style={{...S.importText,marginTop:4}}>{data[yr]["着物組"]}</div>
              </div>
            )}
            {data[yr] && data[yr]["ひよこ組"] && (
              <div>
                <div style={S.groupLabel}>🐣 ひよこ組</div>
                <div style={{...S.importText,marginTop:4}}>{data[yr]["ひよこ組"]}</div>
              </div>
            )}
          </div>
        ))}
      </div>
    );
  }
  return (
    <div>
      {data["着物組"] && (
        <div style={{marginBottom:8}}>
          <div style={S.groupLabel}>🪸 着物組</div>
          <div style={{...S.importText,marginTop:6}}>{data["着物組"]}</div>
        </div>
      )}
      {data["ひよこ組"] && (
        <div>
          <div style={S.groupLabel}>🐣 ひよこ組</div>
          <div style={{...S.importText,marginTop:6}}>{data["ひよこ組"]}</div>
        </div>
      )}
    </div>
  );
}

function SongRow({song, highlight, songDB=SONG_DB}) {
  const isUnknown = !songDB[song.number] || highlight;
  return (
    <div style={{...S.songRow, borderLeft: isUnknown ? "3px solid #e67e22" : `3px solid ${C.gold}`, background: isUnknown ? "#fff8f0" : "#faf7f2"}}>
      <span style={S.songOrder}>#{song.order}</span>
      <span style={{...S.songNum, background: isUnknown ? "#e67e22" : C.border, color: isUnknown ? "#fff" : C.sub}}>{song.number}</span>
      <span style={S.songTitle}>{song.title}</span>
      {isUnknown && <span style={{fontSize:10,color:"#e67e22",fontWeight:"bold",whiteSpace:"nowrap"}}>⚠️ 未登録</span>}
    </div>
  );
}

function typeColor(type) {
  return {"発表会":"#c0392b","演奏会":"#16a085","外部演奏":"#8e44ad","表彰式":"#d4830a"}[type]||"#7f8c8d";
}
